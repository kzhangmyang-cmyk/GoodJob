name: Acquisition contracts

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check acquisition contracts
        run: npm run check:acquisition-contracts
