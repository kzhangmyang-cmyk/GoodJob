openapi: 3.0.3
info:
  title: AI Acquisition API
  version: ai-acquisition.v1
  description: Versioned contract for authenticated AI acquisition operations.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    AsyncOperation:
      type: object
      additionalProperties: false
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}
        requestId: { type: string }
        retryable: { type: boolean }
    PagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: string, nullable: true }
    ModelProvider: &resource
      type: object
      additionalProperties: false
      required: [id]
      properties: { id: { type: string } }
    ModelConnection: *resource
    ModelCallRecord: *resource
    DiscoveryProvider: *resource
    ProviderConnection: *resource
    ContentFetchOperation: *resource
    ImportOperation: *resource
    AcquisitionPlan: *resource
    AcquisitionRun: *resource
    AcquisitionOperationShard: *resource
    OrganizationCandidate: *resource
    DiscoveryEvidence: *resource
    QualificationDecision: *resource
    BattleCard: *resource
    ReviewEvent: *resource
    OutcomeFeedback: *resource
    CopilotSession: *resource
    CopilotTask: *resource
    AuditEvent: *resource
x-error-response: &apiError
  description: Unified API error
  content:
    application/json:
      schema: { $ref: '#/components/schemas/ApiError' }
x-paged-response: &pagedResponse
  description: Cursor-paginated result
  content:
    application/json:
      schema: { $ref: '#/components/schemas/PagedResult' }
x-async-response: &asyncResponse
  description: Accepted asynchronous operation
  content:
    application/json:
      schema: { $ref: '#/components/schemas/AsyncOperation' }
x-read: &read
  security: [{ bearerAuth: [] }]
  responses:
    '200': *pagedResponse
    '401': *apiError
x-list: &list
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }]
  responses:
    '200': *pagedResponse
    '401': *apiError
x-write: &write
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
  responses:
    '200': { description: Successful response, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
    '400': *apiError
    '401': *apiError
x-async-write: &asyncWrite
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
  responses:
    '202': *asyncResponse
    '400': *apiError
    '401': *apiError
paths:
  /api/v1/ai/providers:
    get: { <<: *list, summary: List model providers }
  /api/v1/ai/connections:
    get: { <<: *list, summary: List model connections }
    post: { <<: *write, summary: Create model connection }
  /api/v1/ai/connections/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '401': *apiError } }
    patch: { <<: *write, summary: Update model connection }
    delete: { <<: *write, summary: Delete model connection, responses: { '200': { description: Successful response, content: { application/json: { schema: { type: object, additionalProperties: false } } } }, '400': *apiError, '401': *apiError, '409': { description: Connection is retained by active tasks or audit policy, headers: { X-Error-Code: { required: true, schema: { type: string, enum: [connection_in_use] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } } } }
  /api/v1/ai/connections/{id}/models:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *list, summary: List supported models }
  /api/v1/ai/connections/{id}/test:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *asyncWrite, summary: Test model connection }
  /api/v1/ai/connections/{id}/activate:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Activate model connection }
  /api/v1/ai/calls:
    get: { <<: *list, summary: List model call records }
  /api/v1/ai/calls/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get model call record, responses: { '200': { description: Model call record, content: { application/json: { schema: { $ref: '#/components/schemas/ModelCallRecord' } } } }, '401': *apiError } }
  /api/v1/acquisition/providers:
    get: { <<: *list, summary: List discovery providers }
  /api/v1/acquisition/provider-connections:
    get: { <<: *list, summary: List provider connections }
    post: { <<: *write, summary: Create provider connection }
  /api/v1/acquisition/provider-connections/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get provider connection, responses: { '200': { description: Provider connection, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConnection' } } } }, '401': *apiError } }
    patch: { <<: *write, summary: Update provider connection }
    delete: { <<: *write, summary: Delete provider connection }
  /api/v1/acquisition/provider-connections/{id}/test:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *asyncWrite, summary: Test provider connection }
  /api/v1/acquisition/fetch-operations:
    post: { <<: *asyncWrite, summary: Create content fetch operation }
  /api/v1/acquisition/fetch-operations/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get content fetch operation, responses: { '200': { description: Content fetch operation, content: { application/json: { schema: { $ref: '#/components/schemas/ContentFetchOperation' } } } }, '401': *apiError } }
  /api/v1/acquisition/import-operations:
    post: { <<: *asyncWrite, summary: Create import operation }
  /api/v1/acquisition/import-operations/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get import operation, responses: { '200': { description: Import operation, content: { application/json: { schema: { $ref: '#/components/schemas/ImportOperation' } } } }, '401': *apiError } }
  /api/v1/acquisition/plans:
    get: { <<: *list, summary: List acquisition plans }
    post: { <<: *write, summary: Create acquisition plan }
  /api/v1/acquisition/plans/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get acquisition plan, responses: { '200': { description: Acquisition plan, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionPlan' } } } }, '401': *apiError } }
    patch: { <<: *write, summary: Update acquisition plan }
  /api/v1/acquisition/plans/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Approve acquisition plan }
  /api/v1/acquisition/runs:
    get: { <<: *list, summary: List acquisition runs }
    post: { <<: *asyncWrite, summary: Create acquisition run }
  /api/v1/acquisition/runs/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get acquisition run, responses: { '200': { description: Acquisition run, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionRun' } } } }, '401': *apiError } }
  /api/v1/acquisition/runs/{id}/operation-shards:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *list, summary: List operation shards }
  /api/v1/acquisition/runs/{id}/pause:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Pause acquisition run }
  /api/v1/acquisition/runs/{id}/resume:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Resume paused acquisition run, responses: { '200': { description: Successful response, content: { application/json: { schema: { type: object, additionalProperties: false } } } }, '400': *apiError, '401': *apiError, '409': { description: Budget exhausted runs require a new approved budget and parent run, headers: { X-Error-Code: { required: true, schema: { type: string, enum: [budget_revision_requires_new_run] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } } } }
  /api/v1/acquisition/runs/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Cancel acquisition run }
  /api/v1/acquisition/candidates:
    get: { <<: *list, summary: List candidates }
  /api/v1/acquisition/candidates/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get candidate, responses: { '200': { description: Candidate, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationCandidate' } } } }, '401': *apiError } }
  /api/v1/acquisition/candidates/{id}/evidence:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *list, summary: List candidate evidence }
  /api/v1/acquisition/candidates/{id}/research:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *asyncWrite, summary: Request candidate research }
  /api/v1/acquisition/candidates/{id}/qualification:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get qualification decision, responses: { '200': { description: Qualification decision, content: { application/json: { schema: { $ref: '#/components/schemas/QualificationDecision' } } } }, '401': *apiError } }
    post: { <<: *asyncWrite, summary: Create qualification decision }
  /api/v1/acquisition/candidates/{id}/battle-card:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get battle card, responses: { '200': { description: Battle card, content: { application/json: { schema: { $ref: '#/components/schemas/BattleCard' } } } }, '401': *apiError } }
    post: { <<: *asyncWrite, summary: Create battle card }
  /api/v1/acquisition/candidates/{id}/reviews:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *list, summary: List review events }
  /api/v1/acquisition/candidates/{id}/review:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Review candidate }
  /api/v1/acquisition/candidates/{id}/convert:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Convert candidate }
  /api/v1/acquisition/outcomes:
    get: { <<: *list, summary: List outcome feedback }
    post: { <<: *write, summary: Append outcome feedback }
  /api/v1/acquisition/copilot/sessions:
    post: { <<: *asyncWrite, summary: Create copilot session }
  /api/v1/acquisition/copilot/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get copilot session, responses: { '200': { description: Copilot session, content: { application/json: { schema: { $ref: '#/components/schemas/CopilotSession' } } } }, '401': *apiError } }
  /api/v1/acquisition/copilot/sessions/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *asyncWrite, summary: Send copilot message }
  /api/v1/acquisition/copilot/tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get copilot task, responses: { '200': { description: Copilot task, content: { application/json: { schema: { $ref: '#/components/schemas/CopilotTask' } } } }, '401': *apiError } }
  /api/v1/acquisition/audit-events:
    get: { <<: *list, summary: List audit events }
