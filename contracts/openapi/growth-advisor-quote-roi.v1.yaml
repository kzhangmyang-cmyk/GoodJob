        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currency, asOf, attestationIds]
              properties:
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                asOf: { type: string, format: date-time }
                attestationIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
      responses:
        '201': { $ref: '#/components/responses/RoiClosureVersion' }
        '400': *apiErrorResponse
        '401': *apiErrorResponse
        '403': *apiErrorResponse
        '404': *apiErrorResponse
        '409': *apiErrorResponse
        '412': *apiErrorResponse
        '422': *apiErrorResponse
        '428': *apiErrorResponse
  /api/v1/acquisition/cohorts/{id}/closures:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      <<: *read
      operationId: listRoiClosureVersions
  /api/v1/acquisition/roi-closures/{closureVersionId}/reopen:
    parameters: [{ $ref: '#/components/parameters/closureVersionId' }]
    post:
      <<: *write
      operationId: reopenRoiClosureVersion

  /api/v1/acquisition/growth-performance:
    get:
      <<: *read
      operationId: getGrowthPerformance
      x-goodjob-as-of-upper-bound:
        clock: readStartedAt
        maxFutureSkewSeconds: 1
        effectiveCutoff: min(requestedAsOf,startedAt)
        errorStatus: 422
        errorCode: invalid_as_of
        zeroWritesOnReject: true
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - { name: cohortId, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: asOf, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: planId, in: query, required: false, schema: { type: string, minLength: 1 } }
        - { name: closureVersionId, in: query, required: false, schema: { type: string, minLength: 1 } }
      responses:
        '200': { $ref: '#/components/responses/GrowthPerformanceResponse' }
        '401': *apiErrorResponse
        '403': *apiErrorResponse
        '404': *apiErrorResponse
        '422': *apiErrorResponse
  /api/v1/acquisition/advisor/today:
    get:
      <<: *read
      operationId: getAdvisorToday
      x-goodjob-as-of-upper-bound:
        clock: readStartedAt
        maxFutureSkewSeconds: 1
        effectiveCutoff: min(requestedAsOf,startedAt)
        errorStatus: 422
        errorCode: invalid_as_of
        zeroWritesOnReject: true
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - { name: asOf, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: audienceRole, in: query, required: false, schema: { type: string, enum: [sales, manager, admin, super_admin] } }
        - { name: assignedTo, in: query, required: false, schema: { type: string, minLength: 1 } }
        - $ref: '#/components/parameters/limit'
      responses:
        '200': { $ref: '#/components/responses/AdvisorTodayResponse' }
        '401': *apiErrorResponse
        '403': *apiErrorResponse
        '422': *apiErrorResponse
  /api/v1/acquisition/advisor/recommendations/{id}/accept:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      <<: *write
      operationId: acceptAdvisorRecommendation
      requestBody: &recommendationTransitionBody
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvisorRecommendationTransitionInput' }
      responses: &recommendationTransitionResponses
        '200': { $ref: '#/components/responses/AdvisorRecommendation' }
        '400': *apiErrorResponse
        '401': *apiErrorResponse
        '403': *apiErrorResponse
        '404': *apiErrorResponse
        '409': *apiErrorResponse
        '412': *apiErrorResponse
        '422': *apiErrorResponse
        '428': *apiErrorResponse
  /api/v1/acquisition/advisor/recommendations/{id}/ignore:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      <<: *write
      operationId: ignoreAdvisorRecommendation
      requestBody: *recommendationTransitionBody
      responses: *recommendationTransitionResponses
  /api/v1/acquisition/advisor/recommendations/{id}/complete:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      <<: *write
      operationId: completeAdvisorRecommendation
      description: Resolves the exact persisted action receipt for the same recommendation revision and stable action hash; fails closed when none exists.
      requestBody: *recommendationTransitionBody
      responses: *recommendationTransitionResponses

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: gj_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    workspaceId: { name: workspaceId, in: query, required: true, schema: { type: string, minLength: 1, not: { const: all } } }
    cursor: { name: cursor, in: query, required: false, schema: { type: string, minLength: 1 } }
    limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    sort: { name: sort, in: query, required: false, schema: { type: string, minLength: 1 } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    ifMatch: { name: If-Match, in: header, required: true, schema: { type: string, minLength: 1 } }
    id: { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    itemId: { name: itemId, in: path, required: true, schema: { type: string, minLength: 1 } }
    dealId: { name: dealId, in: path, required: true, schema: { type: string, minLength: 1 } }
    previewId: { name: previewId, in: path, required: true, schema: { type: string, minLength: 1 } }
    closureVersionId: { name: closureVersionId, in: path, required: true, schema: { type: string, minLength: 1 } }
    kind: { name: kind, in: path, required: true, schema: { enum: [acquisition_cost, financial_fact] } }
  schemas:
    ApiError: { $ref: ../json-schema/api-error.v1.schema.json }
    GrowthBootstrapResponse: { $ref: ../json-schema/growth-bootstrap.v1.schema.json }
    CatalogItem: { $ref: ../json-schema/catalog-item.v1.schema.json }
    CatalogItemPagedResult:
      type: object
      additionalProperties: false
      required: [items, nextAfter, hasMore]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
        nextAfter: { type: [string, 'null'] }
        hasMore: { type: boolean }
    PackageVersion: { $ref: ../json-schema/package-version.v1.schema.json }
    PricingPolicyVersion: { $ref: ../json-schema/pricing-policy-version.v1.schema.json }
    QuoteCase: { $ref: ../json-schema/quote-case.v1.schema.json }
    CommercialBindingSnapshot: { $ref: '../json-schema/quote-case.v1.schema.json#/$defs/CommercialBindingSnapshot' }
    QuotePreviewInput: { $ref: '../json-schema/quote-case.v1.schema.json#/$defs/QuotePreviewInput' }
    QuotePreviewIdentity: { $ref: '../json-schema/quote-case.v1.schema.json#/$defs/QuotePreviewIdentity' }
    QuotePreviewResult: { $ref: '../json-schema/quote-case.v1.schema.json#/$defs/QuotePreviewResult' }
    QuoteVersion: { $ref: ../json-schema/quote-version.v1.schema.json }
    QuoteApproval: { $ref: ../json-schema/quote-approval.v1.schema.json }
    QuotePublicationOperation: { $ref: ../json-schema/quote-publication-operation.v1.schema.json }
    DealDecisionInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, quoteVersionId, commercialAmountHash]
          properties:
            kind: { enum: [won, lost] }
            quoteVersionId: { type: string, minLength: 1 }
            commercialAmountHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        - type: object
          additionalProperties: false
          required: [kind, reason]
          properties:
            kind: { const: pre_quote_disqualified }
            reason: { type: string, minLength: 1 }
    AcquisitionCostEntry: { $ref: ../json-schema/acquisition-cost-ledger.v1.schema.json }
    AcquisitionCostEstimate: { $ref: '../json-schema/acquisition-cost-ledger.v1.schema.json#/$defs/AcquisitionCostEstimate' }
    FinancialFact: { $ref: ../json-schema/financial-ledger.v1.schema.json }
    FinancialFactCorrectionInput: { $ref: '../json-schema/financial-ledger.v1.schema.json#/$defs/FinancialFactCorrectionInput' }
    FinancialFactCorrectionResult: { $ref: '../json-schema/financial-ledger.v1.schema.json#/$defs/FinancialFactCorrectionResult' }
    LedgerVerificationEvent: { $ref: '../json-schema/financial-ledger.v1.schema.json#/$defs/LedgerVerificationEvent' }
    FinancialSourceReport: { $ref: '../json-schema/financial-ledger.v1.schema.json#/$defs/FinancialSourceReport' }
    AttributionAllocationSet: { $ref: ../json-schema/allocation-set.v1.schema.json }
    CashSettlementAllocationSet: { $ref: '../json-schema/allocation-set.v1.schema.json#/$defs/CashSettlementAllocationSet' }
    FinanceImportPreview: { $ref: '../json-schema/finance-import-operation.v1.schema.json#/$defs/FinanceImportPreview' }
    FinanceImportOperation: { $ref: ../json-schema/finance-import-operation.v1.schema.json }
    FinanceImportRowError: { $ref: '../json-schema/finance-import-operation.v1.schema.json#/$defs/FinanceImportRowError' }
    AcquisitionCohort: { $ref: ../json-schema/acquisition-cohort.v1.schema.json }
    RoiClosureVersion: { $ref: ../json-schema/roi-closure.v1.schema.json }
    GrowthPerformanceQuery: { $ref: '../json-schema/growth-performance.v1.schema.json#/$defs/GrowthPerformanceQuery' }
    ExpectedRoiCurrencyView: { $ref: '../json-schema/growth-performance.v1.schema.json#/$defs/ExpectedRoiCurrencyView' }
    ActualRoiCurrencyView: { $ref: '../json-schema/growth-performance.v1.schema.json#/$defs/ActualRoiCurrencyView' }
    CashCurrencyView: { $ref: '../json-schema/growth-performance.v1.schema.json#/$defs/CashCurrencyView' }
    RoiCoverageSnapshot: { $ref: '../json-schema/growth-performance.v1.schema.json#/$defs/RoiCoverageSnapshot' }
    RoiGapCode: { $ref: '../json-schema/growth-performance.v1.schema.json#/$defs/RoiGapCode' }
    GrowthPerformanceResponse: { $ref: ../json-schema/growth-performance.v1.schema.json }
    PriorityCustomerView: { $ref: '../json-schema/advisor-today.v1.schema.json#/$defs/PriorityCustomerView' }
    PendingQuoteApprovalView: { $ref: '../json-schema/advisor-today.v1.schema.json#/$defs/PendingQuoteApprovalView' }
    FinancialDataGapView: { $ref: '../json-schema/advisor-today.v1.schema.json#/$defs/FinancialDataGapView' }
    AdvisorTodayQuery: { $ref: '../json-schema/advisor-today.v1.schema.json#/$defs/AdvisorTodayQuery' }
    AdvisorTodayResponse: { $ref: ../json-schema/advisor-today.v1.schema.json }
    AdvisorRecommendation: { $ref: ../json-schema/advisor-recommendation.v1.schema.json }
    AdvisorRecommendationTransitionInput: { $ref: '../json-schema/advisor-recommendation.v1.schema.json#/$defs/AdvisorRecommendationTransitionInput' }
    AdvisorCopilotTaskResult: { $ref: '../json-schema/advisor-recommendation.v1.schema.json#/$defs/AdvisorCopilotTaskResult' }
    AsyncOperation: { $ref: ../json-schema/async-operation.v1.schema.json }
    CopilotSession: { $ref: ../json-schema/copilot-session.v1.schema.json }
    CopilotMessage: { $ref: ../json-schema/copilot-message.v1.schema.json }
    CopilotMessagePagedResult:
      type: object
      additionalProperties: false
      required: [items, nextAfter, hasMore]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CopilotMessage' } }
        nextAfter: { type: [string, 'null'] }
        hasMore: { type: boolean }
    CopilotTask: { $ref: ../json-schema/copilot-task.v1.schema.json }
  responses:
    CatalogItem: &catalogItemResponse { description: Catalog item, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItem' } } } }
    CatalogItemPagedResult: { description: Catalog page, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogItemPagedResult' } } } }
    PackageVersion: { description: Package version, content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersion' } } } }
    PricingPolicyVersion: { description: Pricing policy version with capability-projected sensitive fields, content: { application/json: { schema: { $ref: '#/components/schemas/PricingPolicyVersion' } } } }
    QuoteCase: { description: Quote case, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteCase' } } } }
    QuotePreviewResult: { description: Deterministic quote preview, content: { application/json: { schema: { $ref: '#/components/schemas/QuotePreviewResult' } } } }
    QuoteVersion: { description: Formal actionable quote version, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteVersion' } } } }
    QuoteApproval: { description: Quote approval, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteApproval' } } } }
    QuotePublicationOperation: { description: Quote publication operation, content: { application/json: { schema: { $ref: '#/components/schemas/QuotePublicationOperation' } } } }
    AcquisitionCostEntry: { description: Acquisition cost entry, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionCostEntry' } } } }
    AcquisitionCostEstimate: { description: Acquisition cost estimate, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionCostEstimate' } } } }
    FinancialFact: { description: Financial fact with server-frozen binding, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialFact' } } } }
    FinancialFactCorrectionResult: { description: Append-only financial correction, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialFactCorrectionResult' } } } }
    FinancialSourceReport: { description: Financial source report, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialSourceReport' } } } }
    AttributionAllocationSet: { description: Attribution allocation set, content: { application/json: { schema: { $ref: '#/components/schemas/AttributionAllocationSet' } } } }
    CashSettlementAllocationSet: { description: Cash settlement allocation set, content: { application/json: { schema: { $ref: '#/components/schemas/CashSettlementAllocationSet' } } } }
    FinanceImportPreview: { description: Finance import preview, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceImportPreview' } } } }
    FinanceImportOperation: { description: Finance import operation, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceImportOperation' } } } }
    AcquisitionCohort: { description: Acquisition cohort, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionCohort' } } } }
    RoiClosureVersion: { description: Immutable ROI closure, content: { application/json: { schema: { $ref: '#/components/schemas/RoiClosureVersion' } } } }
    GrowthPerformanceResponse: { description: "Separate expected, actual and cash views", content: { application/json: { schema: { $ref: '#/components/schemas/GrowthPerformanceResponse' } } } }
    AdvisorTodayResponse: { description: Advisor today projection, content: { application/json: { schema: { $ref: '#/components/schemas/AdvisorTodayResponse' } } } }
    AdvisorRecommendation: { description: Advisor recommendation, content: { application/json: { schema: { $ref: '#/components/schemas/AdvisorRecommendation' } } } }
