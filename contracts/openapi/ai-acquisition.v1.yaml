openapi: 3.1.0
info:
  title: AI Acquisition API
  version: ai-acquisition.v1
  description: Versioned contract for authenticated AI acquisition operations.
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: gj_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    candidateId:
      name: candidateId
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    planIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 租户作用域内的写入幂等键；原文不会持久化。
      schema: { type: string, minLength: 8, maxLength: 200 }
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    presentationAfter:
      name: after
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 8192 }
    presentationLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    AsyncOperation: { $ref: ../json-schema/async-operation.v1.schema.json }
    ApiError:
      oneOf:
        - type: object
          additionalProperties: false
          required: [code, message, details, requestId, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            requestId: { type: string }
            retryable: { type: boolean }
        - type: object
          additionalProperties: false
          required: [error]
          properties:
            error:
              type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
                details: {}
                requestId: { type: string }
    PagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
    ModelProvider: { $ref: ../json-schema/model-provider.v1.schema.json }
    ModelConnection: { $ref: ../json-schema/model-connection.v1.schema.json }
    ModelCallRecord: { $ref: ../json-schema/model-call-record.v1.schema.json }
    DiscoveryProvider: { $ref: ../json-schema/discovery-provider.v1.schema.json }
    ProviderConnection: { $ref: ../json-schema/provider-connection.v1.schema.json }
    ContentFetchOperation: { $ref: ../json-schema/content-fetch-operation.v1.schema.json }
    ImportOperation: { $ref: ../json-schema/import-operation.v1.schema.json }
    AcquisitionPlan: { $ref: ../json-schema/acquisition-plan.v1.schema.json }
    AcquisitionRun: { $ref: ../json-schema/acquisition-run.v1.schema.json }
    AcquisitionOperationShard: { $ref: ../json-schema/acquisition-operation-shard.v1.schema.json }
    AcquisitionRunPresentation: { $ref: ../json-schema/acquisition-run-presentation.v1.schema.json }
    OrganizationCandidate: { $ref: ../json-schema/organization-candidate.v1.schema.json }
    IndividualDemandSignal: { $ref: ../json-schema/individual-demand-signal.v1.schema.json }
    Candidate:
      oneOf:
        - { $ref: '#/components/schemas/OrganizationCandidate' }
        - { $ref: '#/components/schemas/IndividualDemandSignal' }
    CandidatePagedResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        nextCursor: { type: [string, 'null'] }
    DiscoveryEvidence: { $ref: ../json-schema/discovery-evidence.v1.schema.json }
    QualificationDecision: { $ref: ../json-schema/qualification-decision.v1.schema.json }
    BattleCardV1: { $ref: ../json-schema/battle-card.v1.schema.json }
    BattleCardV2: { $ref: ../json-schema/battle-card.v2.schema.json }
    BattleCard:
      oneOf:
        - { $ref: '#/components/schemas/BattleCardV1' }
        - { $ref: '#/components/schemas/BattleCardV2' }
    ReviewEvent: { $ref: ../json-schema/review-event.v1.schema.json }
    OutcomeFeedback: { $ref: ../json-schema/outcome-feedback.v1.schema.json }
    CopilotSession: { $ref: ../json-schema/copilot-session.v1.schema.json }
    CopilotTask: { $ref: ../json-schema/copilot-task.v1.schema.json }
    AuditEvent: { type: object, additionalProperties: false, required: [id], properties: { id: { type: string } } }
x-error-response: &apiError
  description: Unified API error
  content:
    application/json:
      schema: { $ref: '#/components/schemas/ApiError' }
x-paged-response: &pagedResponse
  description: Cursor-paginated result
  content:
    application/json:
      schema: { $ref: '#/components/schemas/PagedResult' }
x-async-response: &asyncResponse
  description: Accepted asynchronous operation
  content:
    application/json:
      schema: { $ref: '#/components/schemas/AsyncOperation' }
x-read: &read
  security: [{ bearerAuth: [] }]
  responses:
    '200': *pagedResponse
    '401': *apiError
x-list: &list
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }]
  responses:
    '200': *pagedResponse
    '401': *apiError
x-write: &write
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
  responses:
    '200': { description: Successful response, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
    '400': *apiError
    '401': *apiError
x-async-write: &asyncWrite
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
  responses:
    '202': *asyncResponse
    '400': *apiError
    '401': *apiError
x-plan-create-schema: &planCreateSchema
  { type: object, required: [name, objective, icp, subjectChannels, providerConnections, operations, budgetSnapshot, stopConditions], properties: { name: { type: string, minLength: 1, maxLength: 200 }, objective: { type: string, minLength: 1, maxLength: 2000 }, icp: { type: object, required: [industries, regions, organizationCriteria, individualCriteria, exclusionRules], properties: { industries: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }, regions: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }, organizationCriteria: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 500 } }, individualCriteria: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 500 } }, exclusionRules: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 500 } } }, additionalProperties: false }, subjectChannels: { type: object, required: [organization, individual], properties: { organization: { type: boolean }, individual: { type: boolean } }, additionalProperties: false }, providerConnections: { type: array, minItems: 1, maxItems: 100, items: { type: object, required: [connectionId, providerId, kind, status, credentialVersion], properties: { connectionId: { type: string, minLength: 1, maxLength: 255 }, providerId: { type: string, minLength: 1, maxLength: 100 }, kind: { type: string, enum: [search, content_fetch, import] }, status: { type: string, enum: [active, inactive, disabled] }, credentialVersion: { type: integer, minimum: 1 } }, additionalProperties: false } }, operations: { type: array, minItems: 1, maxItems: 500, items: { type: object, required: [operationId, subjectChannel, kind, connectionId, allocatedBudget], properties: { operationId: { type: string, minLength: 1, maxLength: 255 }, subjectChannel: { type: string, enum: [organization, individual] }, kind: { type: string, enum: [search, content_fetch, import_rows] }, connectionId: { type: string, minLength: 1, maxLength: 255 }, query: { type: string, minLength: 1, maxLength: 4000 }, sourceRef: { type: string, minLength: 1, maxLength: 4000 }, allocatedBudget: { type: object, required: [requests, results, amountMinor, durationSeconds], properties: { requests: { type: integer, minimum: 0 }, results: { type: integer, minimum: 0 }, amountMinor: { type: integer, minimum: 0 }, durationSeconds: { type: integer, minimum: 0 } }, additionalProperties: false } }, additionalProperties: false } }, budgetSnapshot: { type: object, required: [billingCurrency, maxRequests, maxResults, maxAmountMinor, maxDurationSeconds], properties: { billingCurrency: { type: string, minLength: 3, maxLength: 3 }, maxRequests: { type: integer, minimum: 0 }, maxResults: { type: integer, minimum: 0 }, maxAmountMinor: { type: integer, minimum: 0 }, maxDurationSeconds: { type: integer, minimum: 0 } }, additionalProperties: false }, modelConnectionId: { type: string, nullable: true, minLength: 1, maxLength: 255, description: 可选 BYOK 模型连接；服务端据此绑定不可伪造的模型快照。 }, stopConditions: { type: object, required: [stopWhenBudgetExhausted, stopWhenNoMoreResults], properties: { stopWhenBudgetExhausted: { type: boolean }, stopWhenNoMoreResults: { type: boolean } }, additionalProperties: false } }, additionalProperties: false }
x-plan-mutation-schema: &planMutationSchema
  { type: object, minProperties: 1, properties: { name: { type: string, minLength: 1, maxLength: 200 }, objective: { type: string, minLength: 1, maxLength: 2000 }, icp: { type: object, required: [industries, regions, organizationCriteria, individualCriteria, exclusionRules], properties: { industries: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }, regions: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 120 } }, organizationCriteria: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 500 } }, individualCriteria: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 500 } }, exclusionRules: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 500 } } }, additionalProperties: false }, subjectChannels: { type: object, required: [organization, individual], properties: { organization: { type: boolean }, individual: { type: boolean } }, additionalProperties: false }, providerConnections: { type: array, minItems: 1, maxItems: 100, items: { type: object, required: [connectionId, providerId, kind, status, credentialVersion], properties: { connectionId: { type: string, minLength: 1, maxLength: 255 }, providerId: { type: string, minLength: 1, maxLength: 100 }, kind: { type: string, enum: [search, content_fetch, import] }, status: { type: string, enum: [active, inactive, disabled] }, credentialVersion: { type: integer, minimum: 1 } }, additionalProperties: false } }, operations: { type: array, minItems: 1, maxItems: 500, items: { type: object, required: [operationId, subjectChannel, kind, connectionId, allocatedBudget], properties: { operationId: { type: string, minLength: 1, maxLength: 255 }, subjectChannel: { type: string, enum: [organization, individual] }, kind: { type: string, enum: [search, content_fetch, import_rows] }, connectionId: { type: string, minLength: 1, maxLength: 255 }, query: { type: string, minLength: 1, maxLength: 4000 }, sourceRef: { type: string, minLength: 1, maxLength: 4000 }, allocatedBudget: { type: object, required: [requests, results, amountMinor, durationSeconds], properties: { requests: { type: integer, minimum: 0 }, results: { type: integer, minimum: 0 }, amountMinor: { type: integer, minimum: 0 }, durationSeconds: { type: integer, minimum: 0 } }, additionalProperties: false } }, additionalProperties: false } }, budgetSnapshot: { type: object, required: [billingCurrency, maxRequests, maxResults, maxAmountMinor, maxDurationSeconds], properties: { billingCurrency: { type: string, minLength: 3, maxLength: 3 }, maxRequests: { type: integer, minimum: 0 }, maxResults: { type: integer, minimum: 0 }, maxAmountMinor: { type: integer, minimum: 0 }, maxDurationSeconds: { type: integer, minimum: 0 } }, additionalProperties: false }, modelSnapshotRef: { type: object, required: [jobSnapshotId, connectionId, credentialVersion, provider, model, capabilitySnapshotHash, promptVersion, schemaVersion, promptHash, schemaHash], properties: { jobSnapshotId: { type: string, minLength: 1, maxLength: 255 }, connectionId: { type: string, minLength: 1, maxLength: 255 }, credentialVersion: { type: integer, minimum: 1 }, provider: { type: string, minLength: 1, maxLength: 100 }, model: { type: string, minLength: 1, maxLength: 200 }, capabilitySnapshotHash: { type: string, minLength: 1, maxLength: 200 }, promptVersion: { type: string, minLength: 1, maxLength: 100 }, schemaVersion: { type: string, minLength: 1, maxLength: 100 }, promptHash: { type: string, minLength: 1, maxLength: 200 }, schemaHash: { type: string, minLength: 1, maxLength: 200 } }, additionalProperties: false }, stopConditions: { type: object, required: [stopWhenBudgetExhausted, stopWhenNoMoreResults], properties: { stopWhenBudgetExhausted: { type: boolean }, stopWhenNoMoreResults: { type: boolean } }, additionalProperties: false } }, additionalProperties: false }
x-plan-approval-schema: &planApprovalSchema
  { type: object, required: [decision, reason], properties: { decision: { type: string, enum: [approve] }, reason: { type: string, minLength: 1, maxLength: 2000 } }, additionalProperties: false }
x-plan-run-schema: &planRunSchema
  { type: object, properties: { parentRunId: { type: string, minLength: 1, maxLength: 255 }, reason: { type: string, maxLength: 2000 } }, additionalProperties: false }
x-plan-control-schema: &planControlSchema
  { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000 } }, additionalProperties: false }
paths:
  /api/v1/ai/providers:
    get: { <<: *list, summary: List model providers }
  /api/v1/ai/connections:
    get: { <<: *list, summary: List model connections }
    post: { <<: *write, summary: Create model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '400': *apiError, '401': *apiError } }
  /api/v1/ai/connections/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '401': *apiError } }
    patch: { <<: *write, summary: Update model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '400': *apiError, '401': *apiError } }
    delete: { <<: *write, summary: Delete model connection, responses: { '200': { description: Successful response, content: { application/json: { schema: { type: object, additionalProperties: false } } } }, '400': *apiError, '401': *apiError, '409': { description: Connection is retained by active tasks or audit policy, headers: { X-Error-Code: { required: true, schema: { type: string, enum: [connection_in_use] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } } } }
  /api/v1/ai/connections/{id}/models:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *list, summary: List supported models }
  /api/v1/ai/connections/{id}/test:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *asyncWrite, summary: Test model connection }
  /api/v1/ai/connections/{id}/activate:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *write, summary: Activate model connection, responses: { '200': { description: Model connection, content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnection' } } } }, '400': *apiError, '401': *apiError } }
  /api/v1/ai/calls:
    get: { <<: *list, summary: List model call records }
  /api/v1/ai/calls/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get model call record, responses: { '200': { description: Model call record, content: { application/json: { schema: { $ref: '#/components/schemas/ModelCallRecord' } } } }, '401': *apiError } }
  /api/v1/acquisition/providers:
    get: { <<: *list, summary: List discovery providers }
  /api/v1/acquisition/provider-connections:
    get: { <<: *list, summary: List provider connections }
    post: { <<: *write, summary: Create provider connection }
  /api/v1/acquisition/provider-connections/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get provider connection, responses: { '200': { description: Provider connection, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConnection' } } } }, '401': *apiError } }
    patch: { <<: *write, summary: Update provider connection }
    delete: { <<: *write, summary: Delete provider connection }
  /api/v1/acquisition/provider-connections/{id}/test:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { <<: *asyncWrite, summary: Test provider connection }
  /api/v1/acquisition/fetch-operations:
    post: { <<: *asyncWrite, summary: Create content fetch operation }
  /api/v1/acquisition/fetch-operations/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get content fetch operation, responses: { '200': { description: Content fetch operation, content: { application/json: { schema: { $ref: '#/components/schemas/ContentFetchOperation' } } } }, '401': *apiError } }
  /api/v1/acquisition/import-operations:
    post: { <<: *asyncWrite, summary: Create import operation }
  /api/v1/acquisition/import-operations/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { <<: *read, summary: Get import operation, responses: { '200': { description: Import operation, content: { application/json: { schema: { $ref: '#/components/schemas/ImportOperation' } } } }, '401': *apiError } }
  /api/v1/acquisition/evidence/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      <<: *read
      summary: Get discovery evidence
      responses:
        '200':
          description: Discovery evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryEvidence' }
        '401': *apiError
  /api/v1/acquisition/plans:
    post:
      summary: Create acquisition plan
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/planIdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: *planCreateSchema } } }
      responses:
        '201': { description: Acquisition plan created, headers: { ETag: { required: true, schema: { type: string, minLength: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionPlan' } } } }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '500': *apiError
  /api/v1/acquisition/plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    get:
      summary: Get acquisition plan
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        '200': { description: Acquisition plan, headers: { ETag: { required: true, schema: { type: string, minLength: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionPlan' } } } }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '500': *apiError
    patch:
      summary: Update acquisition plan
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ifMatch' }]
      requestBody: { required: true, content: { application/json: { schema: *planMutationSchema } } }
      responses:
        '200': { description: Acquisition plan updated, headers: { ETag: { required: true, schema: { type: string, minLength: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionPlan' } } } }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '412': *apiError
        '428': *apiError
        '500': *apiError
  /api/v1/acquisition/plans/{id}/revisions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    post:
      summary: Create acquisition plan revision
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ifMatch' }]
      requestBody: { required: true, content: { application/json: { schema: *planMutationSchema } } }
      responses:
        '201': { description: Acquisition plan revision created, headers: { ETag: { required: true, schema: { type: string, minLength: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionPlan' } } } }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '412': *apiError
        '428': *apiError
        '500': *apiError
  /api/v1/acquisition/plans/{id}/approval:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    post:
      summary: Approve acquisition plan
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody: { required: true, content: { application/json: { schema: *planApprovalSchema } } }
      responses:
        '200':
          description: Acquisition plan approved
          headers:
            ETag:
              required: true
              schema: { type: string, minLength: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcquisitionPlan' }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '412': *apiError
        '428': *apiError
        '500': *apiError
  /api/v1/acquisition/plans/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    post:
      summary: Create acquisition run
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/planIdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: *planRunSchema } } }
      responses:
        '202': { description: Acquisition run accepted, headers: { ETag: { required: true, schema: { type: string, minLength: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionRun' } } } }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '500': *apiError
  /api/v1/acquisition/runs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    get:
      summary: Get acquisition run
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        '200': { description: Acquisition run, headers: { ETag: { required: true, schema: { type: string, minLength: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionRun' } } } }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '500': *apiError
  /api/v1/acquisition/runs/{id}/shards:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    get:
      summary: List acquisition run shards
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        '200': { description: Acquisition run shards, content: { application/json: { schema: { $ref: '#/components/schemas/PagedResult' } } } }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '500': *apiError
  /api/v1/acquisition/runs/{id}/presentation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    get:
      summary: Get acquisition run presentation
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/presentationAfter' }, { $ref: '#/components/parameters/presentationLimit' }]
      responses:
        '200': { description: Acquisition run presentation, content: { application/json: { schema: { $ref: '#/components/schemas/AcquisitionRunPresentation' } } } }
        '400': *apiError
        '401': *apiError
        '404': *apiError
        '409': *apiError
        '500': *apiError
  /api/v1/acquisition/runs/{id}/pause:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    post: &runControl
      summary: Pause acquisition run
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ifMatch' }]
      requestBody: { required: true, content: { application/json: { schema: *planControlSchema } } }
      responses:
